<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お申し込み受付完了 | I-ESLP | WS PARTNERS</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logos/symbol.svg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark:       #080d18;
      --gold:          #c9a84c;
      --gold-lt:       #f0d080;
      --gold-dk:       #8b6914;
      --gold-grad:     linear-gradient(135deg,#f0d080 0%,#c9a84c 50%,#8b6914 100%);
      --accent-orange: #cfa844;
      --primary:       #8b6914;
      --secondary:     #e6c46a;
      --text-main:     #1c1a14;
      --text-muted:    #5a5240;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(201,168,76,.20), transparent 70%),
        linear-gradient(160deg,#080d18 0%,#101a30 55%,#080d18 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #fff;
      text-align: center;
    }

    .card {
      background: #fffdf7;
      border: 1px solid rgba(201,168,76,.45);
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 560px;
      width: 100%;
      color: var(--text-main);
      box-shadow: 0 25px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(201,168,76,.18);
      animation: fadeUp .6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: none; }
    }

    .icon-check {
      width: 72px;
      height: 72px;
      background: var(--gold-grad);
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(201,168,76,.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-check svg { width: 36px; height: 36px; }

    .card h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .card .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .info-box {
      background: #fbf5e6;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
      margin-bottom: 28px;
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.8;
    }
    .info-box strong { color: var(--text-main); }
    .info-box a { color: var(--primary); word-break: break-all; }


    .zoom-notes {
      font-size: 0.8rem;
      color: #888;
      margin-top: 10px;
      white-space: pre-line;
    }

    .btn-return {
      display: inline-block;
      background: var(--gold-grad);
      color: #0a0e1a;
      font-weight: 900;
      letter-spacing: .06em;
      font-size: 1rem;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      transition: background .2s, transform .2s;
      box-shadow: 0 8px 22px rgba(201,168,76,.40);
    }
    .btn-return:hover {
      background: linear-gradient(135deg,#f7e2ac,#c9a84c);
      transform: translateY(-2px);
    }

    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: rgba(230,220,196,.55);
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      .card h1 { font-size: 1.3rem; }
    }
  </style>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-TLGVMTDZ');</script>

</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TLGVMTDZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="card">
  <div class="icon-check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0a0e1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1 id="card-title"></h1>
  <p class="subtitle" id="card-subtitle"></p>

  <div class="info-box">
    <p><strong id="next-heading"></strong></p>
    <p id="next-body" style="margin-top:4px;white-space:pre-line"></p>
    <p class="zoom-notes" id="next-notes"></p>
    <br>
    <p><strong id="contact-title"></strong></p>
    <p style="margin-top:4px">
      WS PARTNERS PTE LTD<br>
      <a href="mailto:support@ws-partners.com.sg">support@ws-partners.com.sg</a><br>
      +65-6978-4066
    </p>
  </div>

  <a href="javascript:void(0)" onclick="goBackToLP()" class="btn-return" id="btn-return">LPページへ戻る</a>
</div>

<footer>
  &copy; WS PARTNERS PTE LTD. All rights reserved.
</footer>

<script>
  var i18n = {
    ja: {
      htmlLang:    'ja',
      title:       'お申し込みありがとうございます。',
      subtitle:    'Indonesia Executive Strategy &amp; Leadership Program（I-ESLP）へのお申し込みを受け付けました。<br>ご登録いただいたメールアドレスへ、受付完了メールを送信いたしました。',
      nextHeading: '今後の流れ',
      nextBody:    '各回の日程・会場・受講料は現在調整中です。\n確定次第、お申し込みいただいた企業様へ優先的にご案内いたします。\nその後、請求書（Invoice）をEメールにてお送りいたします。',
      nextNotes:   '※メールが届かない場合は、迷惑メールフォルダをご確認ください。\n※ご不明な点は、下記お問い合わせ先までご連絡ください。',
      contactTitle: 'お問い合わせ',
      btnReturn:   'LPページへ戻る'
    },
    id: {
      htmlLang:    'id',
      title:       'Terima kasih atas pendaftaran Anda.',
      subtitle:    'Pendaftaran Anda untuk Indonesia Executive Strategy &amp; Leadership Program (I-ESLP) telah kami terima.<br>Email konfirmasi telah dikirimkan ke alamat email yang Anda daftarkan.',
      nextHeading: 'Langkah Selanjutnya',
      nextBody:    'Tanggal, lokasi, dan biaya setiap sesi saat ini sedang difinalisasi.\nSetelah ditetapkan, kami akan menginformasikannya kepada perusahaan yang telah mendaftar secara prioritas.\nSelanjutnya, invoice akan kami kirimkan melalui email.',
      nextNotes:   '※ Jika Anda tidak menerima email, silakan periksa folder spam Anda.\n※ Untuk pertanyaan lebih lanjut, silakan hubungi kontak di bawah ini.',
      contactTitle: 'Hubungi Kami',
      btnReturn:   'Kembali ke Halaman LP'
    }
  };

  (function () {
    var lang = (new URLSearchParams(window.location.search)).get('lang') || 'ja';
    var t    = i18n[lang] || i18n['ja'];

    document.documentElement.lang = t.htmlLang;

    document.getElementById('card-title').textContent    = t.title;
    document.getElementById('card-subtitle').innerHTML = t.subtitle;
    document.getElementById('next-heading').textContent  = t.nextHeading;
    document.getElementById('next-body').textContent     = t.nextBody;
    document.getElementById('next-notes').textContent    = t.nextNotes;
    document.getElementById('contact-title').textContent = t.contactTitle;
    document.getElementById('btn-return').textContent    = t.btnReturn;
  })();

  function goBackToLP() {
    var ref = document.referrer;
    if (ref && ref !== window.location.href) {
      window.location.href = ref.split('#')[0];
    } else {
      history.back();
    }
  }
</script>
</body>
</html>
